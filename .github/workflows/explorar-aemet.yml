# Prueba de una sola vez (tercera vuelta): el canal de avisos de la isla de
# Tenerife y el texto del Plan Meteoalerta (fenomenos, niveles, formato CAP).
# Solo lee y lo escribe en el registro; no guarda nada en el repo. Va en esta
# rama, no en main.
name: Explorar avisos AEMET (prueba, solo lee)

on:
  push:
    branches: ['claude/tenerife-go-security-review-7r5ayk']
    paths: ['.github/workflows/explorar-aemet.yml']

permissions:
  contents: read

jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - name: Canal de la isla de Tenerife
        shell: python3 {0}
        run: |
          import re, io, tarfile, urllib.request
          def pedir(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'}), timeout=40) as r:
                  return dict(r.headers), r.read()
          for canal in ('CAP_AFAP6596_RSS.xml', 'CAP_AFAZ659601_RSS.xml'):
              h, b = pedir('https://www.aemet.es/documentos_d/eltiempo/prediccion/avisos/rss/' + canal)
              s = b.decode('utf-8', 'replace')
              print('=' * 20, canal, h.get('Content-Type'), h.get('Last-Modified'), len(b))
              print(s)
              m = re.search(r'<item>.*?<link>([^<]+)</link>', s, re.S)
              if m:
                  h2, c = pedir(m.group(1))
                  print('TAR', m.group(1), h2.get('Content-Type'), len(c))
                  tf = tarfile.open(fileobj=io.BytesIO(c))
                  for nm in tf.getnames():
                      x = tf.extractfile(nm).read().decode('utf-8', 'replace')
                      ev = re.findall(r'<event>([^<]+)</event>', x)
                      zon = re.findall(r'<geocode>\s*<valueName>[^<]+</valueName>\s*<value>([^<]+)</value>', x)
                      par = re.findall(r'<parameter>\s*<valueName>([^<]+)</valueName>\s*<value>([^<]*)</value>', x)
                      print('  ', nm, '|', ev[:2], '| zonas', sorted(set(zon)), '| param', par[:6])

      - name: Texto del Plan Meteoalerta (anexo CAP y plan)
        run: |
          pip install -q pypdf >/dev/null 2>&1
          for u in https://www.aemet.es/documentos/es/eltiempo/prediccion/avisos/plan_meteoalerta/METEOALERTA_ANX3_CAP.pdf https://www.aemet.es/documentos/es/eltiempo/prediccion/avisos/plan_meteoalerta/plan_meteoalerta.pdf; do
            curl -sS -A 'Mozilla/5.0' -o /tmp/x.pdf "$u"
            echo "=============== PDF $u"
            python3 - <<'EOF'
          from pypdf import PdfReader
          r = PdfReader('/tmp/x.pdf')
          for i, p in enumerate(r.pages):
              print('########## PAGINA', i + 1)
              print(p.extract_text() or '')
          EOF
          done
