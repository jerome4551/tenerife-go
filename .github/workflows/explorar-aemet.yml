# Prueba de una sola vez (segunda vuelta): que fuentes de avisos de AEMET se
# pueden leer sin clave desde fuera y en que formato llegan. Solo lee y lo
# escribe en el registro; no guarda nada en el repo. Va en esta rama, no en main.
name: Explorar avisos AEMET (prueba, solo lee)

on:
  push:
    branches: ['claude/tenerife-go-security-review-7r5ayk']
    paths: ['.github/workflows/explorar-aemet.yml']

permissions:
  contents: read

jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - name: AEMET directo
        shell: python3 {0}
        run: |
          import re, html, io, tarfile, urllib.request, urllib.error
          UAS = {
            'navegador': 'Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0',
            'python': None,
            'curl': 'curl/8.5.0',
          }
          def pedir(url, ua='navegador', extra=None):
              h = {}
              if UAS[ua]: h['User-Agent'] = UAS[ua]
              if extra: h.update(extra)
              req = urllib.request.Request(url, headers=h)
              try:
                  with urllib.request.urlopen(req, timeout=40) as r:
                      return r.status, dict(r.headers), r.read()
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers), e.read()
              except Exception as e:
                  return None, {}, str(e).encode()
          def cab(h):
              return {k: v for k, v in h.items() if k.lower() in ('content-type', 'access-control-allow-origin', 'last-modified', 'content-length')}

          print('=' * 30, 'PAGINA DE CANARIAS')
          st, h, b = pedir('https://www.aemet.es/es/rss_info/avisos/coo')
          print(st, cab(h), len(b))
          t = b.decode('iso-8859-15', 'replace')
          filas = re.findall(r'<tr[^>]*>(.*?)</tr>', t, re.S)
          for f in filas:
              txt = re.sub(r'\s+', ' ', html.unescape(re.sub(r'<[^>]+>', ' ', f))).strip()
              hr = re.findall(r'href="([^"]+)"', f)
              if hr:
                  print('FILA', txt[:80], '|', ' '.join(hr))

          url = 'https://www.aemet.es/documentos_d/eltiempo/prediccion/avisos/rss/CAP_AFAC65_RSS.xml'
          ok = None
          for ua in UAS:
              for extra in (None, {'Accept': 'application/rss+xml, application/xml;q=0.9, */*;q=0.8'}):
                  st, h, b = pedir(url, ua, extra)
                  rech = b'Request Rejected' in b
                  print('CANAL 65 con UA', ua, 'Accept' if extra else '', '->', st, cab(h), len(b), 'RECHAZADO' if rech else 'OK')
                  if not rech and st == 200 and ok is None:
                      ok = (ua, extra, b)
          if ok:
              b = ok[2].decode('utf-8', 'replace')
              print(b[:4000])
              enl = re.findall(r'<link>([^<]+)</link>', b) + re.findall(r'<enclosure[^>]+url="([^"]+)"', b)
              print('ENLACES', enl[:10])
              for u in enl:
                  if not re.search(r'\.(tar|gz|xml)$', u) or u.endswith('_RSS.xml'):
                      continue
                  st, h, c = pedir(u, ok[0], ok[1])
                  print('=' * 20, 'FICHERO', u, st, cab(h), len(c), 'RECHAZADO' if b'Request Rejected' in c else '')
                  try:
                      tf = tarfile.open(fileobj=io.BytesIO(c))
                      nombres = tf.getnames()
                      print('TAR con', len(nombres))
                      n = 0
                      for nm in nombres:
                          x = tf.extractfile(nm).read().decode('utf-8', 'replace')
                          if 'Tenerife' in x:
                              n += 1
                              if n <= 2:
                                  print('-' * 20, nm); print(x[:9000])
                      print('con Tenerife:', n)
                  except Exception as e:
                      print('no tar', e); print(c[:3000].decode('utf-8', 'replace'))
                  break

      - name: MeteoAlarm (los mismos avisos de AEMET), zonas de Tenerife
        shell: python3 {0}
        run: |
          import json, urllib.request, datetime
          req = urllib.request.Request('https://feeds.meteoalarm.org/api/v1/warnings/feeds-spain',
                                       headers={'User-Agent': 'Mozilla/5.0', 'Origin': 'https://jerome4551.github.io'})
          with urllib.request.urlopen(req, timeout=60) as r:
              print('cabeceras', {k: v for k, v in r.headers.items()})
              d = json.load(r)
          ws = d['warnings']
          print('avisos en el fichero', len(ws), 'claves de arriba', list(d.keys()))
          zonas = {}
          for w in ws:
              for inf in w['alert']['info']:
                  for a in inf.get('area', []):
                      if 'Tenerife' in a['areaDesc']:
                          for g in a.get('geocode', []):
                              zonas[a['areaDesc']] = g['value']
          print('ZONAS DE TENERIFE VISTAS', zonas)
          ahora = datetime.datetime.now(datetime.timezone.utc)
          tf = []
          for w in ws:
              al = w['alert']
              for inf in al['info']:
                  if any('Tenerife' in a['areaDesc'] for a in inf.get('area', [])):
                      tf.append((al, inf))
          print('infos con Tenerife', len(tf))
          vistos = 0
          for al, inf in tf:
              exp = datetime.datetime.fromisoformat(inf['expires'])
              nivel = [p['value'] for p in inf.get('parameter', []) if p['valueName'] == 'awareness_level']
              print(al['identifier'], al['msgType'], al.get('status'), inf['language'], inf['event'], '|', nivel, '| onset', inf.get('onset'), '| expires', inf['expires'], 'CADUCADO' if exp < ahora else 'VIGENTE')
          for al, inf in tf:
              exp = datetime.datetime.fromisoformat(inf['expires'])
              nivel = ' '.join(p['value'] for p in inf.get('parameter', []) if p['valueName'] == 'awareness_level')
              if exp > ahora and 'green' not in nivel and vistos < 3:
                  vistos += 1
                  print('=' * 20, 'VIGENTE NO VERDE')
                  print(json.dumps(al, ensure_ascii=False, indent=1)[:6000])
          # cuantos avisos verdes y no verdes hay en todo el fichero, por nivel
          from collections import Counter
          c = Counter()
          for w in ws:
              for inf in w['alert']['info']:
                  for p in inf.get('parameter', []):
                      if p['valueName'] == 'awareness_level':
                          c[p['value']] += 1
          print('niveles en todo el fichero', c)
          print('msgType', Counter(w['alert']['msgType'] for w in ws))
          print('idiomas', Counter(inf['language'] for w in ws for inf in w['alert']['info']))

      - name: Zonas de Tenerife en el Plan Meteoalerta (PDF oficial)
        run: |
          pip install -q pypdf >/dev/null 2>&1
          for u in https://www.aemet.es/documentos/es/eltiempo/prediccion/avisos/plan_meteoalerta/plan_meteoalerta.pdf https://www.aemet.es/documentos/es/eltiempo/prediccion/avisos/plan_meteoalerta/METEOALERTA_ANX3_CAP.pdf; do
            curl -sS -A 'Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0' -o /tmp/x.pdf "$u"
            echo "=============== $u"
            python3 - <<'EOF'
          import re
          from pypdf import PdfReader
          r = PdfReader('/tmp/x.pdf')
          print('paginas', len(r.pages))
          for i, p in enumerate(r.pages):
              t = p.extract_text() or ''
              for m in re.finditer(r'Tenerife', t):
                  print('PAG', i + 1, '::', t[max(0, m.start() - 300): m.end() + 300].replace('\n', ' | '))
          EOF
          done
