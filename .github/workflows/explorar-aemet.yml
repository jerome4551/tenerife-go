# Prueba de una sola vez: que fuentes de avisos de AEMET se pueden leer sin
# clave desde fuera, en que formato llegan y si el navegador puede pedirlas
# directamente (cabeceras CORS). Solo lee y lo escribe en el registro; no
# guarda nada en el repo. Va en esta rama, no en main.
name: Explorar avisos AEMET (prueba, solo lee)

on:
  push:
    branches: ['claude/tenerife-go-security-review-7r5ayk']
    paths: ['.github/workflows/explorar-aemet.yml']

permissions:
  contents: read

jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - name: Fuentes de avisos
        shell: python3 {0}
        run: |
          import re, html, io, tarfile, urllib.request, urllib.error, json
          UA = 'Mozilla/5.0 (X11; Linux x86_64) TenerifeGo-prueba'
          ORIGEN = 'https://jerome4551.github.io'

          def pedir(url, n=None, origen=False):
              req = urllib.request.Request(url, headers={'User-Agent': UA, **({'Origin': ORIGEN} if origen else {})})
              try:
                  with urllib.request.urlopen(req, timeout=40) as r:
                      cuerpo = r.read()
                      return r.status, dict(r.headers), cuerpo
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers), e.read()
              except Exception as e:
                  return None, {}, str(e).encode()

          def cab(h):
              return {k: v for k, v in h.items() if k.lower() in ('content-type', 'access-control-allow-origin',
                      'last-modified', 'cache-control', 'content-length', 'date', 'location')}

          print('=' * 30, 'INDICE RSS')
          st, h, b = pedir('https://www.aemet.es/es/rss_info/avisos/esp')
          print(st, cab(h), len(b))
          t = b.decode('utf-8', 'replace')
          canales = []
          for m in re.finditer(r'<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>', t, re.S):
              href = html.unescape(m.group(1)); txt = html.unescape(re.sub(r'<[^>]+>', ' ', m.group(2))).strip()
              txt = re.sub(r'\s+', ' ', txt)
              if 'rss' in href.lower() or 'atom' in href.lower() or href.endswith(('.xml', '.tar', '.gz')):
                  print('ENLACE', href, '|', txt[:90])
                  canales.append((href, txt))
          # contexto alrededor de Canarias y Tenerife
          for pal in ('Canarias', 'Tenerife'):
              for m in re.finditer(pal, t):
                  frag = re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', t[max(0, m.start() - 400): m.end() + 400]))
                  print('CONTEXTO', pal, '::', frag[:500])
                  break
          hrefs = re.findall(r'href="([^"]*(?:rss|RSS|atom|ATOM)[^"]*)"', t)
          print('HREFS rss/atom:', len(hrefs))
          for x in sorted(set(hrefs)):
              print('  ', html.unescape(x))

          def absol(u):
              if u.startswith('http'):
                  return u
              return 'https://www.aemet.es' + (u if u.startswith('/') else '/' + u)

          elegidos = [absol(u) for u in sorted(set(hrefs)) if re.search(r'(65|38|Canarias|canarias|Tenerife|tenerife)', u)]
          print('ELEGIDOS', elegidos)
          primero_items = []
          for u in elegidos[:12]:
              print('=' * 30, 'CANAL', u)
              st, h, b = pedir(u, origen=True)
              print(st, cab(h), len(b))
              s = b.decode('utf-8', 'replace')
              print(s[:3000])
              for it in re.findall(r'<link>([^<]+)</link>', s)[:4]:
                  primero_items.append(it)
              for it in re.findall(r'<link[^>]+href="([^"]+)"', s)[:4]:
                  primero_items.append(html.unescape(it))
              for it in re.findall(r'<enclosure[^>]+url="([^"]+)"', s)[:4]:
                  primero_items.append(html.unescape(it))

          print('=' * 30, 'ITEMS', primero_items)
          vistos = set()
          for u in primero_items:
              if u in vistos or 'aemet' not in u:
                  continue
              vistos.add(u)
              if not re.search(r'\.(tar|gz|xml)$', u) and 'documentos' not in u:
                  continue
              print('=' * 30, 'FICHERO', u)
              st, h, b = pedir(u, origen=True)
              print(st, cab(h), len(b))
              if b[:5] == b'<?xml' or b[:1] == b'<':
                  print(b.decode('utf-8', 'replace')[:6000])
                  continue
              try:
                  tf = tarfile.open(fileobj=io.BytesIO(b))
                  nombres = tf.getnames()
                  print('TAR con', len(nombres), 'ficheros:', nombres[:60])
                  n = 0
                  for nm in nombres:
                      x = tf.extractfile(nm).read().decode('utf-8', 'replace')
                      if 'Tenerife' in x:
                          n += 1
                          if n <= 3:
                              print('-' * 20, nm)
                              print(x[:7000])
                  print('ficheros con Tenerife:', n)
              except Exception as e:
                  print('no es tar:', e, b[:300])
              if len(vistos) > 8:
                  break

          print('=' * 30, 'METEOALARM')
          for u in ('https://feeds.meteoalarm.org/feeds/meteoalarm-legacy-atom-spain',
                    'https://feeds.meteoalarm.org/feeds/meteoalarm-legacy-rss-spain',
                    'https://feeds.meteoalarm.org/api/v1/warnings/feeds-spain'):
              st, h, b = pedir(u, origen=True)
              s = b.decode('utf-8', 'replace')
              print('-' * 20, u, st, cab(h), len(s))
              print(s[:1500])
              for m in re.finditer(r'Tenerife', s):
                  print('TENERIFE ::', s[max(0, m.start() - 1500): m.end() + 1500])
                  break

          print('=' * 30, 'OPENDATA SIN CLAVE')
          for u in ('https://opendata.aemet.es/opendata/api/avisos_cap/ultimoelaborado/area/65',):
              st, h, b = pedir(u, origen=True)
              print(u, st, cab(h), b[:400])

          print('=' * 30, 'PLAN METEOALERTA (zonas)')
          for u in ('https://www.aemet.es/documentos/es/eltiempo/prediccion/avisos/plan_meteoalerta/METEOALERTA_ANX3_CAP.pdf',
                    'https://www.aemet.es/documentos/es/eltiempo/prediccion/avisos/plan_meteoalerta/plan_meteoalerta.pdf'):
              st, h, b = pedir(u)
              print(u, st, cab(h), len(b))
              if st == 200 and b[:4] == b'%PDF':
                  open('/tmp/' + u.rsplit('/', 1)[1], 'wb').write(b)

      - name: Texto de los PDF del Plan Meteoalerta (zonas de Tenerife)
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true
          for f in /tmp/*.pdf; do
            [ -f "$f" ] || continue
            echo "=============== $f"
            pdftotext -layout "$f" - | grep -n -i -B2 -A2 "tenerife\|6538\|zona" | head -150
          done
