# La App Store sin Mac (21 de octubre de 2026, LANZAMIENTO-APP-STORE.md §9).
#
# GitHub presta una maquina macOS por minutos (gratis en los repositorios
# publicos: «Use of the standard GitHub-hosted runners is free and unlimited
# on public repositories», docs.github.com/actions/reference/runners/github-hosted-runners,
# leido el 21-10-2026). En ella se hace lo que en un Mac se haria con Xcode:
# montar app/www/, generar el proyecto de Capacitor, aplicar las plantillas
# (permisos, idiomas, privacidad, icono, arranque), firmar, archivar y subir a
# TestFlight. La ficha y las capturas suben desde Linux (deliver no necesita
# Mac). Todo lo que hace cada paso esta en app/fastlane/Fastfile.
#
# SOLO A MANO: pestana Actions -> «App Store» -> Run workflow, eligiendo que:
#   alta        una vez: crea el identificador (Bundle ID) y comprueba que la ficha
#               existe en App Store Connect; la ficha («New App») la crea Jerome a mano
#               una vez (la API de Apple no deja crearla)
#   testflight  firma, archiva y sube un build a TestFlight
#   ficha       sube los textos en las diez localizaciones y las capturas
#   todo        testflight + ficha
# Nunca pulsa «Submit for Review»: eso es de Jerome.
#
# SECRETOS (Settings -> Secrets and variables -> Actions), todos desde el movil:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8     clave API de App Store Connect (Users and Access -> Integrations -> App Store Connect API; el .p8 entero)
#   APPLE_TEAM_ID                             developer.apple.com/account -> Membership details
#   MATCH_GIT_URL                             un repositorio PRIVADO vacio (p. ej. https://github.com/jerome4551/tenerife-go-firma.git)
#   MATCH_GIT_TOKEN                           un token de GitHub «fine-grained» SOLO para ese repositorio, con
#                                             Contents «Read and write» (no uno clasico con permiso repo, que abre
#                                             todos los repositorios de la cuenta), TAL CUAL: el base64 de
#                                             «usuario:token» que pide match lo hace el flujo, y lo tapa en los registros
#   MATCH_PASSWORD                            una contrasena larga, inventada: cifra el certificado en ese repositorio
#   ASC_REVIEW_NAME, ASC_REVIEW_PHONE, ASC_REVIEW_EMAIL   (ficha) el contacto de la revision: «Jérôme Bourgeois», «+34…», el correo
# La primera vez que corre testflight, match CREA el certificado y el perfil
# (MATCH_READONLY vacio). Despues, poner MATCH_READONLY=1 (variable, no secreto)
# para que solo los lea.

name: App Store

on:
  workflow_dispatch:
    inputs:
      que:
        description: 'alta · testflight · ficha · todo'
        required: true
        default: 'testflight'
        type: choice
        options: [alta, testflight, ficha, todo]

permissions:
  contents: read

concurrency:
  group: app-store
  cancel-in-progress: false

env:
  TGO_APP_ID: tenerifego.app
  # fastlane pide un idioma UTF-8 (si no, avisa y algun texto puede salir mal)
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  # ── 0 · el alta en App Store Connect (una vez): Linux basta ──────────────
  alta:
    if: ${{ inputs.que == 'alta' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: app
      - name: Crear el identificador y comprobar la ficha
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
        run: bundle exec fastlane ios alta

  # ── 1 · el binario: macOS, Xcode 26 (Capacitor 8 lo exige) ──────────────
  testflight:
    if: ${{ inputs.que == 'testflight' || inputs.que == 'todo' }}
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 26
        run: |
          ls /Applications | grep -i xcode || true
          # la mas alta de las 26 que no sea beta: Apple no acepta binarios de un Xcode beta
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: app

      - name: Dependencias de Capacitor
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Montar app/www/ desde la raiz
        run: node ../tools/app_preparar.js

      - name: El proyecto de Xcode (Capacitor) y las plantillas
        run: |
          # «cap add ios» no arranca si ya existe ios/ (ahi viven las plantillas):
          # se aparta ios/ un momento y luego vuelven las plantillas
          if [ ! -d ios/App ]; then
            T=$(mktemp -d)
            mv ios/plantillas "$T"/ && rm -rf ios
            npx cap add ios || { mkdir -p ios; mv "$T"/plantillas ios/; exit 1; }
            mv "$T"/plantillas ios/
          fi
          bash ios/plantillas/aplicar.sh
          bundle exec ruby ios/plantillas/incluir.rb
          npx cap sync ios

      - name: Firmar, archivar y subir a TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
          MATCH_GIT_USER: ${{ github.repository_owner }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_READONLY: ${{ vars.MATCH_READONLY }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
        run: |
          # match pide base64 de «usuario:token»: se hace aqui, del token tal
          # cual, y se tapa en los registros (GitHub solo tapa los secretos, no
          # lo que se calcula con ellos)
          MATCH_GIT_BASIC_AUTHORIZATION=$(printf '%s:%s' "$MATCH_GIT_USER" "$MATCH_GIT_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$MATCH_GIT_BASIC_AUTHORIZATION"
          export MATCH_GIT_BASIC_AUTHORIZATION
          bundle exec fastlane ios subir_testflight

      - name: Guardar el .ipa y los simbolos (30 dias)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: TenerifeGo-ipa-${{ github.run_number }}
          path: |
            app/build/*.ipa
            app/build/*.dSYM.zip
          if-no-files-found: ignore
          retention-days: 30

  # ── 2 · la ficha y las capturas: Linux basta ─────────────────────────────
  ficha:
    if: ${{ inputs.que == 'ficha' || inputs.que == 'todo' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: app

      - name: Playwright (Chromium) para las capturas
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Montar app/www/ (la app de la tienda, con la marca)
        run: node tools/app_preparar.js

      - name: Las capturas de la app de verdad, en los diez idiomas
        env:
          TGO_PLAYWRIGHT: ${{ github.workspace }}/node_modules/playwright
        run: |
          # de app/www/, no de la raiz: la raiz es la web (sin el mapa detallado
          # dentro, con el boton flotante de la PWA); la herramienta para si no ve la marca
          python3 -m http.server 8766 --bind 127.0.0.1 --directory app/www >/dev/null 2>&1 &
          sleep 2
          node tools/capturas_app_store.js 8766 --idiomas=todos

      - name: La ficha en el formato de deliver (de datos/app-store/ficha.json)
        run: |
          pip3 install --quiet --break-system-packages pillow 2>/dev/null || pip3 install --quiet pillow
          node tools/app_store_metadata.js --comprobar
          node tools/app_store_metadata.js

      - name: Subir la ficha y las capturas a App Store Connect
        working-directory: app
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_REVIEW_NAME: ${{ secrets.ASC_REVIEW_NAME }}
          ASC_REVIEW_PHONE: ${{ secrets.ASC_REVIEW_PHONE }}
          ASC_REVIEW_EMAIL: ${{ secrets.ASC_REVIEW_EMAIL }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
        run: bundle exec fastlane ios ficha

      - name: Guardar las capturas (30 dias)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: capturas-app-store-${{ github.run_number }}
          path: capturas-app-store/
          if-no-files-found: ignore
          retention-days: 30
