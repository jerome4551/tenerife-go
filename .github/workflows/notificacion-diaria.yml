# =====================================================================
#  TENERIFE GO  ·  Notificacion diaria
#  Va en el repo en:  .github/workflows/notificacion-diaria.yml
#  Se ejecuta sola cada manana. La franja de las 9/10 la aplica el script
#  (hora real de Canarias). La tabla push_sends evita enviar dos veces.
#  Un lanzamiento manual (Run workflow) siempre envia.
# =====================================================================
name: Notificacion diaria Tenerife Go

on:
  schedule:
    # NO usar el minuto :00 (es el mas saturado y el que GitHub mas retrasa/salta).
    # Varios intentos en la manana; push_sends evita que se envie mas de una vez.
    - cron: '7 8 * * *'    # 08:07 UTC
    - cron: '37 8 * * *'   # 08:37 UTC
    - cron: '7 9 * * *'    # 09:07 UTC
    - cron: '37 9 * * *'   # 09:37 UTC
  workflow_dispatch:

# El GITHUB_TOKEN de este job solo necesita leer el repo. Sin este bloque
# hereda los permisos por defecto del repositorio, que en repos antiguos
# son de escritura sobre todo (contents, packages, issues...): si alguna
# dependencia del job fuera comprometida, ese token podria escribir en el
# repo. Se reduce al minimo.
permissions:
  contents: read

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Version exacta, no el rango "@3": el job corre con las claves VAPID
      # y la service_role de Supabase en el entorno, asi que una release
      # nueva de web-push entraria sola con acceso a esos secretos.
      - name: Instalar web-push
        run: npm install --no-audit --no-fund web-push@3.6.7

      - name: Enviar notificaciones
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC:         ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE:        ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT:        'mailto:tenerife.go.app@gmail.com'
          APP_URL:              'https://jerome4551.github.io/tenerife-go/'
          FORCE:                ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: node enviar-notificacion.js
