# Prueba de una sola vez (cuarta vuelta): el texto del Decreto 71/2003 en el
# BOC n. 102 de 2003 (Fiesta de los Corazones de Tejina). Solo lee y lo
# escribe en el registro. Va en esta rama, no en main.
name: Explorar BOC (prueba, solo lee)

on:
  push:
    branches: ['claude/tenerife-go-security-review-7r5ayk']
    paths: ['.github/workflows/explorar-boc.yml']

permissions:
  contents: read

jobs:
  leer:
    runs-on: ubuntu-latest
    steps:
      - name: pypdf
        run: python3 -m pip install -q pypdf
      - name: El decreto, en los PDF del BOC n. 102 de 2003
        shell: python3 {0}
        run: |
          import re, io, urllib.request
          from pypdf import PdfReader
          def pedir(u):
              req = urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0'})
              with urllib.request.urlopen(req, timeout=90) as r:
                  return r.read()
          for n in range(7, 8):
              u = 'https://www.gobiernodecanarias.org/boc/2003/102/boc-2003-102-%03d.pdf' % n
              try:
                  b = pedir(u)
              except Exception as e:
                  print(u, 'ERROR', e); continue
              t = '\n'.join((p.extract_text() or '') for p in PdfReader(io.BytesIO(b)).pages)
              if 'Tejina' not in t:
                  print(u, 'sin Tejina'); continue
              print('=' * 30, u, len(b))
              t = re.sub(r'[ \t]+', ' ', t)
              k = t.find('931 ')
              k = k if k >= 0 else t.find('Tejina')
              print(t[max(0, k - 100): k + 9000])
              break
