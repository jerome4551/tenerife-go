# Prueba de una sola vez (quinta vuelta): el anexo del Decreto 71/2003 en el
# BOC n. 102 de 2003 (Fiesta de los Corazones de Tejina), para comprobar la
# fecha de la fiesta. Solo lee y lo escribe en el registro. Va en esta rama,
# no en main.
name: Explorar BOC (prueba, solo lee)

on:
  push:
    branches: ['claude/tenerife-go-security-review-7r5ayk']
    paths: ['.github/workflows/explorar-boc.yml']

permissions:
  contents: read

jobs:
  leer:
    runs-on: ubuntu-latest
    steps:
      - name: pypdf
        run: python3 -m pip install -q pypdf
      - name: La disposicion 931 entera, con su anexo
        shell: python3 {0}
        run: |
          import re, io, urllib.request
          from pypdf import PdfReader
          def pedir(u):
              req = urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0'})
              with urllib.request.urlopen(req, timeout=90) as r:
                  return r.read()
          todo = ''
          for n in (7, 8):
              u = 'https://www.gobiernodecanarias.org/boc/2003/102/boc-2003-102-%03d.pdf' % n
              try:
                  b = pedir(u)
              except Exception as e:
                  print(u, 'ERROR', e); continue
              paginas = PdfReader(io.BytesIO(b)).pages
              print('=' * 30, u, len(b), 'bytes,', len(paginas), 'paginas')
              todo += '\n'.join((p.extract_text() or '') for p in paginas) + '\n'
          t = re.sub(r'[ \t]+', ' ', todo)
          k = t.find('931 DECRETO 71/2003')
          if k < 0:
              k = t.find('Tejina')
          fin = t.find('\n932 ', k + 10)
          print('desde', k, 'hasta', fin)
          print(t[k: fin if fin > 0 else k + 30000])
          print('=' * 30, 'agosto / Bartolom en todo el texto leido')
          for m in re.finditer(r'agosto|Bartolom', t):
              print(m.start(), repr(t[max(0, m.start() - 300): m.start() + 300]))
