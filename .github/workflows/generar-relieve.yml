name: Generar relieve 3D (MDT05 del IGN; si no sale, Copernicus DEM)

# Se lanza a mano: repositorio -> Actions -> "Generar relieve 3D" -> Run workflow.
# Desde el movil, en Safari, vale igual.
#
# QUE HACE
#   Primero, el MDT05 del IGN (31 de octubre de 2026, tarde; Jerome: «Fuentes
#   3D la mejor pero gratis»): el modelo digital del TERRENO de 5 m de los
#   vuelos LiDAR del PNOA, CC BY 4.0, sin cuenta, desde la API de coberturas
#   de la IDEE (tools/relieve_ign.py, a trozos). Lo compara con el Copernicus
#   DEM y, si casa y pasa --comprobar, el relieve sale de el. Si no (el
#   servicio no contesta o devuelve otra cosa, falta tierra, no casa, o no
#   pasa --comprobar), el relieve sale del Copernicus DEM GLO-30 (ESA / Union
#   Europea, en el registro de datos abiertos de AWS: sin cuenta ni clave),
#   como antes, y el resumen dice por que. Con fuente = copernicus, solo
#   Copernicus.
#   tools/relieve_construir.py hace los tres ficheros que usa «La isla en
#   3D»: mapa/tenerife-relieve.png, mapa/tenerife-relieve-ao.png y
#   mapa/tenerife-relieve.json, con el credito de la fuente que haya servido.
#   Despues los coteja con --comprobar y, en el mismo commit, pone la huella
#   del relieve nuevo en sw.js y en index.html (ver HUELLAS en la
#   herramienta): un sw.js distinto es lo que hace que los moviles que ya
#   tienen la app bajen el relieve al precache.
#
# LAS TESELAS
#   La isla va de 27,998 N (la punta de Rasca, en la costa del mapa) a 28,59 N:
#   casi entera en la tesela N28 W017, que tiene que estar. La punta de Rasca,
#   unos 200 m por debajo de 28 N, cae en la N27 W017: se pide tambien, y si
#   no existe (403 o 404 de S3), la herramienta rellena esas pocas celdas de
#   la orilla con la celda con modelo mas cercana y lo apunta en el .json.
#   Cualquier otro error al bajarla para el workflow, para no construir sin
#   ella por un fallo de red.
#
# POR QUE UN WORKFLOW
#   El contenedor donde se desarrolla solo puede leer GitHub; el runner tiene
#   salida a red. Y el resultado sale byte a byte igual con las mismas teselas.
on:
  workflow_dispatch:
    inputs:
      solo_probar:
        description: 'true = genera y verifica pero NO hace commit'
        required: false
        default: 'false'
      fuente:
        description: 'ign = el MDT05 del IGN, y si no sale, Copernicus; copernicus = solo Copernicus'
        required: false
        # una lista cerrada: GitHub no deja lanzarlo con otro valor
        type: choice
        options:
          - ign
          - copernicus
        default: 'ign'

permissions: {}

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    outputs:
      fuente: ${{ steps.construir.outputs.fuente }}
    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v5

      - name: Python y sus paquetes
        run: |
          set -euo pipefail
          python3 -m pip install --quiet numpy pillow scipy
          python3 -c "import numpy, PIL, scipy; print('numpy', numpy.__version__, '· Pillow', PIL.__version__, '· scipy', scipy.__version__)"
          # rasterio lee cualquier GeoTIFF que devuelva la IDEE (con cualquier compresion); si no
          # se instala, relieve_ign.py lee con Pillow
          python3 -m pip install --quiet rasterio || echo "::warning::rasterio no se ha instalado: relieve_ign.py leera con Pillow"

      - name: Bajar las teselas del Copernicus DEM
        run: |
          set -euo pipefail
          BASE=https://copernicus-dem-30m.s3.amazonaws.com
          mkdir -p dem
          # la del norte: la isla casi entera. Tiene que estar.
          T=Copernicus_DSM_COG_10_N28_00_W017_00_DEM
          curl -sSfL --retry 3 -o "dem/${T}.tif" "${BASE}/${T}/${T}.tif"
          # la del sur: la punta de Rasca. Puede no existir.
          T=Copernicus_DSM_COG_10_N27_00_W017_00_DEM
          code=$(curl -sSL --retry 3 -o "dem/${T}.tif" -w '%{http_code}' "${BASE}/${T}/${T}.tif" || true)
          case "$code" in
            200) echo "N27 W017: esta" ;;
            403|404) rm -f "dem/${T}.tif"; echo "N27 W017: no existe (HTTP $code); la punta de Rasca se rellena y se apunta" ;;
            *) echo "::error::N27 W017: HTTP ${code:-sin respuesta}. No se construye sin ella por un fallo de red: vuelva a lanzarlo."; exit 1 ;;
          esac
          ls -l dem/
          sha256sum dem/*.tif

      - name: Bajar el MDT05 del IGN
        id: ign
        if: github.event.inputs.fuente != 'copernicus'
        continue-on-error: true
        # si la IDEE va muy lenta o no contesta, este paso se corta solo y el relieve sale de
        # Copernicus; sin este tope, el del job (75 min) lo cortaria todo y no saldria ninguno.
        # Un paso que se pasa de tiempo queda «failure» y, con continue-on-error, el job sigue
        # (actions/runner, src/Runner.Worker/StepsRunner.cs y ApplyContinueOnError)
        timeout-minutes: 40
        run: |
          set -o pipefail
          python3 tools/relieve_ign.py dem-ign 2>&1 | tee ign.txt

      - name: Construir el relieve
        id: construir
        # lo que viene de fuera del guion (la opcion elegida al lanzarlo y como acabo el paso del
        # IGN) entra por variables de entorno, no pegado en el codigo del shell
        env:
          FUENTE_PEDIDA: ${{ github.event.inputs.fuente }}
          IGN_RESULTADO: ${{ steps.ign.outcome }}
        run: |
          set -uo pipefail
          : > construir.txt
          # construir y comprobar: si cualquiera de los dos falla, esa fuente no vale
          probar() {
            python3 tools/relieve_construir.py "$@" 2>&1 | tee -a construir.txt &&
              python3 tools/relieve_construir.py --comprobar 2>&1 | tee comprobar.txt &&
              grep -qx '  RELIEVE EN VERDE' comprobar.txt
          }
          FUENTE=copernicus-glo30
          if [ "$IGN_RESULTADO" = "success" ] && [ -s dem-ign/ign-mdt05-tenerife.tif ]; then
            if probar dem-ign/ign-mdt05-tenerife.tif --fuente ign-mdt05 \
                 --registro dem-ign/ign-mdt05-tenerife.json --cotejar dem/*.tif; then
              FUENTE=ign-mdt05
            else
              echo "::warning::El relieve con el MDT05 del IGN no ha pasado (ver arriba): se hace con el Copernicus DEM"
            fi
          elif [ "$FUENTE_PEDIDA" != "copernicus" ]; then
            echo "::warning::El MDT05 del IGN no se ha podido bajar (ver el paso anterior): el relieve se hace con el Copernicus DEM"
          fi
          if [ "$FUENTE" = copernicus-glo30 ]; then
            # lo del IGN que se hubiera escrito a medias no se queda: se rehace todo con Copernicus
            probar dem/*.tif || { echo "::error::Tampoco sale con el Copernicus DEM."; exit 1; }
          fi
          echo "fuente=$FUENTE" >> "$GITHUB_OUTPUT"
          echo "Fuente del relieve: $FUENTE"

      - name: Comprobar
        run: |
          set -euo pipefail
          python3 tools/relieve_construir.py --comprobar | tee comprobar.txt
          grep -qx '  RELIEVE EN VERDE' comprobar.txt

      - name: Resumen legible en el movil
        if: always()
        run: |
          {
            echo "## Relieve 3D de Tenerife"
            echo ""
            echo "**Fuente: ${{ steps.construir.outputs.fuente || 'ninguna' }}** (MDT05 del IGN: ${{ steps.ign.outcome || 'no se intento' }})"
            echo ""
            echo '```'
            ls -l dem/ 2>/dev/null || true
            echo ""
            echo "--- el MDT05 del IGN (lo ultimo) ---"
            tail -n 25 ign.txt 2>/dev/null || echo "(no se intento)"
            echo ""
            cat construir.txt 2>/dev/null || echo "(no llego a construirse)"
            echo ""
            cat comprobar.txt 2>/dev/null || echo "(no llego a comprobarse)"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Guardar los ficheros
        uses: actions/upload-artifact@v4
        with:
          name: relieve
          path: |
            mapa/tenerife-relieve.png
            mapa/tenerife-relieve-ao.png
            mapa/tenerife-relieve.json
          if-no-files-found: error
          retention-days: 7

  # Job aparte: aqui no se ejecuta nada de lo bajado, solo se commitea.
  commit:
    needs: generar
    if: github.event.inputs.solo_probar != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v5

      - name: Recoger los ficheros
        uses: actions/download-artifact@v4
        with:
          name: relieve
          path: mapa

      - name: La huella del relieve, en sw.js y en index.html
        run: |
          set -euo pipefail
          # la misma que escribe tools/relieve_construir.py: los 16 primeros
          # del sha256 del .json; una linea en cada fichero, ni mas ni menos
          H=$(sha256sum mapa/tenerife-relieve.json | cut -c1-16)
          test "$(grep -cE "^const RELIEVE_HUELLA = '[^']*';$" sw.js)" = 1
          test "$(grep -cE "^  var RELIEVE_HUELLA = '[^']*';$" index.html)" = 1
          sed -i -E "s|^const RELIEVE_HUELLA = '[^']*';$|const RELIEVE_HUELLA = '${H}';|" sw.js
          sed -i -E "s|^  var RELIEVE_HUELLA = '[^']*';$|  var RELIEVE_HUELLA = '${H}';|" index.html
          test "$(grep -cx "const RELIEVE_HUELLA = '${H}';" sw.js)" = 1
          test "$(grep -cx "  var RELIEVE_HUELLA = '${H}';" index.html)" = 1
          echo "huella: ${H}"

      - name: Commit si ha cambiado
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mapa/tenerife-relieve.png mapa/tenerife-relieve-ao.png mapa/tenerife-relieve.json sw.js index.html
          if git diff --cached --quiet; then
            echo "El relieve no ha cambiado: no hay commit."
            exit 0
          fi
          git commit -m "Relieve 3D: ${{ needs.generar.outputs.fuente }} con la costa del mapa detallado"
          git push
