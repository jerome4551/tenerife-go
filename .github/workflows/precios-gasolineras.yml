# Precios de las gasolineras: las más baratas de cada municipio (sesion 92) y
# el precio de cada gasolinera de la app, para el boton «la mas barata cerca de
# mi» (sesion 93).
# Fuente: Ministerio para la Transicion Ecologica y el Reto Demografico,
# Geoportal de Gasolineras (servicio REST publico), el mismo registro del que
# salen las fichas.
#
# Lo pidio Jerome (sesion 92): dos veces al dia, a las 7:00 y a las 15:00 de
# Canarias. Escribe SOLO datos/precios-gasolineras.json; ningun precio entra en
# index.html (LEEME de las gasolineras: son datos perecederos), y el registro
# revisado del que salen las fichas (registro/gasolineras-canarias.json) no se
# toca.
#
# POR QUE NO BASTA CON EL CRON DE GITHUB (medido el 7 de octubre).
# Desde el 26 de agosto de 2026 el programador de GitHub esta roto para todo
# el mundo (github.com/orgs/community/discussions/207346 y 209514, sin
# respuesta de GitHub): los flujos programados salen con horas de retraso o
# no salen. En este repo, la notificacion diaria sale de 5 a 7 horas tarde,
# todos los dias, y va a peor; y este flujo, con un cron cada hora, solo
# corrio 2 veces en 16 horas (02:26 y 10:21 UTC), casi 8 horas una de otra.
# Lanzado con workflow_dispatch, en cambio, arranca en segundos.
#
# LA SOLUCION: un reloj de fuera (cron-job.org, ver RELOJ-EXTERNO.md) llama a
# la API de GitHub a las 7:05, 7:35, 15:05 y 15:35 de Canarias con
# {"ref":"main","inputs":{"forzar":"no"}}. Con forzar=no manda
# tools/precios_gasolineras.py --toca, que mira la hora REAL de Canarias y el
# fichero: el primer aviso despues de las 7:00 baja los precios de esa franja,
# el primero despues de las 15:00 los de la suya, y los demas terminan en
# segundos sin bajar ni escribir nada. Por eso el de y media no estorba: solo
# trabaja si el de en punto fallo.
#
# El cron de cada hora se queda de respaldo: si el reloj de fuera dejara de
# llamar (el token caduca al ano), GitHub seguiria lanzandolo, tarde, y la
# app no ensena precios de mas de 2 dias. No usa el minuto :00, el mas
# saturado.
#
# Uso a mano: pestana Actions -> "Precios gasolineras" -> Run workflow, con
# forzar=si (lo que sale por defecto): baja y escribe aunque no toque.

name: Precios gasolineras

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      forzar:
        description: 'si = bajar los precios aunque ya esten los de esta franja (a mano). no = solo si toca (el reloj de fuera).'
        type: choice
        options: ['si', 'no']
        default: 'si'

permissions:
  contents: write

concurrency:
  group: precios-gasolineras
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: ¿Toca? (franjas de las 7:00 y las 15:00 de Canarias)
        id: toca
        # La entrada va por el entorno y no pegada en el guion: un valor que
        # viene de fuera no se escribe nunca dentro de un comando.
        env:
          EVENTO: ${{ github.event_name }}
          FORZAR: ${{ inputs.forzar }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$FORZAR" != "no" ]; then
            echo "toca=si" >> "$GITHUB_OUTPUT"
          else
            echo "toca=$(python3 tools/precios_gasolineras.py --toca)" >> "$GITHUB_OUTPUT"
          fi
          echo "evento=$EVENTO forzar=${FORZAR:-(no viene)} -> $(tail -1 "$GITHUB_OUTPUT")"

      - name: Descargar el registro del Ministerio (Canarias)
        if: steps.toca.outputs.toca == 'si'
        run: |
          set -euo pipefail
          RUTA="PreciosCarburantes/EstacionesTerrestres/FiltroCCAA/05"
          for BASE in "https://energia.serviciosmin.gob.es/ServiciosRestCarburantes" \
                      "https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes"; do
            if curl -sS --fail --retry 3 --retry-delay 15 --max-time 120 \
                 -H "Accept: application/json" -o "$RUNNER_TEMP/registro.json" "$BASE/$RUTA"; then
              echo "Descargado de $BASE"
              exit 0
            fi
          done
          echo "::error::No se pudo descargar el registro desde ninguno de los dos dominios"
          exit 1

      - name: Las mas baratas de cada municipio, y el precio de cada una
        if: steps.toca.outputs.toca == 'si'
        env:
          PYTHONIOENCODING: utf-8
        run: python3 tools/precios_gasolineras.py --registro "$RUNNER_TEMP/registro.json" --forzar

      - name: Guardar en el repo
        if: steps.toca.outputs.toca == 'si'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/precios-gasolineras.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          FRANJA=$(python3 -c "import json;print(json.load(open('datos/precios-gasolineras.json'))['franja'])")
          git commit -m "Precios gasolineras: franja $FRANJA (Canarias)"
          for i in 1 2 3 4; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((i * 10))
          done
          echo "::error::No se pudo subir el fichero de precios"
          exit 1
