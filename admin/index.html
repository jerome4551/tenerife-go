<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Tenerife Go</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co">
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div id="admin-panel">
  <header><h1>Panel Admin Seguro</h1><button id="logout">Salir</button></header>
  <main>
    <section>
      <h2>Estadísticas (service_role solo en servidor)</h2>
      <p>Favoritos: <span id="favCount">-</span></p>
      <p>Push subs: <span id="pushCount">-</span> (no se puede listar por RLS, solo via Edge Function)</p>
    </section>
    <section>
      <h2>Añadir Lugar (validado)</h2>
      <form id="placeForm">
        <input type="text" id="placeId" placeholder="id-ej-montana-roja" pattern="[a-z0-9-]{3,50}" required>
        <input type="number" id="lat" placeholder="28.2916" step="0.0001" min="27" max="29" required>
        <input type="number" id="lng" placeholder="-16.6291" step="0.0001" min="-17" max="-15" required>
        <button type="submit">Guardar (via Edge Function)</button>
      </form>
    </section>
  </main>
</div>
<script type="module">
import { requireAdmin, logoutAdmin } from '../js/auth.js';
import { supabase } from '../js/supabase-client.js';

await requireAdmin();

document.getElementById('logout').addEventListener('click', async () => {
  await logoutAdmin();
  window.location.href = './login.html';
});

// Ejemplo de escritura segura via Edge Function (no directo desde cliente)
document.getElementById('placeForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = document.getElementById('placeId').value.trim();
  const lat = parseFloat(document.getElementById('lat').value);
  const lng = parseFloat(document.getElementById('lng').value);
  
  // Validación cliente + servidor
  if (!/^[a-z0-9-]{3,50}$/.test(id)) return alert('ID inválido');
  if (lat < 27 || lat > 29 || lng < -17 || lng > -15) return alert('Coords fuera de Tenerife');
  
  // Llamada a Edge Function que usa service_role
  const { error } = await supabase.functions.invoke('admin-add-place', {
    body: { id, lat, lng }
  });
  if (error) alert('Error: ' + error.message);
  else alert('Lugar añadido via Edge Function segura');
});
</script>
</body>
</html>
