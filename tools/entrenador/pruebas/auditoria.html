<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>auditoría del entrenador</title>
<style>html, body { margin: 0; } #caja { width: 100%; max-width: 430px; padding: 10px; box-sizing: border-box; }</style>
<div id="caja"></div>
<script src="../../../modulos/entrenador.js"></script>
<script>
/* La página de tools/auditar_entrenador.js: monta el vídeo de un ejercicio con los datos de verdad de la app
   (datos/cuerpo/) y lo pasa entero, cuadro a cuadro, apuntando lo que se lee en cada paso. */
var DATOS = '../../../datos/cuerpo/', EJ = null, TXS = {};
function pedir(f) { return fetch(DATOS + f).then(function (r) { if (!r.ok) throw new Error(f + ' ' + r.status); return r.json(); }); }
window.preparar = function (idiomas) {
  return Promise.all([pedir('ejercicios.json')].concat(idiomas.map(function (l) { return pedir('ejercicios-' + l + '.json'); }))).then(function (r) {
    EJ = {}; r[0].ejercicios.forEach(function (e) { EJ[e.id] = e; });
    idiomas.forEach(function (l, i) { TXS[l] = r[i + 1]; });
    return Object.keys(EJ).length;
  });
};
window.R = null;
window.montar = function (id, lang, tema) {
  if (window.R) { window.R.quitar(); window.R = null; }
  var x = EJ[id], t = (TXS[lang] || {})[id] || TXS.es[id], nombres = {};
  x.g.concat(x.s).forEach(function (g) { nombres[g] = g; });
  window.R = TG_ENTRENADOR.montar(document.getElementById('caja'), { id: id, nombre: t[0], pasos: t[1], pasosEs: TXS.es[id][1], prim: x.g, sec: x.s.filter(function (g) { return x.g.indexOf(g) < 0; }),
    nombres: nombres, etiquetas: [x.e[0]], entorno: x.e[0], nivel: x.n }, { idioma: lang, tema: tema || 'dia' });
  return window.R ? { pasos: t[1], nombre: t[0], dur: window.R.tramos.reduce(function (a, q) { return a + q.dur; }, 0) } : null;
};
window.entero = function () {
  var R = window.R, leido = [], raros = 0, cuadros = 0, nodos = 0, modos = {};
  R.suena = true; R.gran.hidden = true;
  while (!R.fin && cuadros < 30 * 300) {
    R.avanzar(1 / 30); cuadros++;
    var t = R.tramos[R.n];
    if (t.tipo === 'paso' && R.tt > t.dur * 0.9 && leido[t.i] == null) leido[t.i] = R.pasoL.textContent;
    modos[R.dir.busto ? 'busto' : R.dir.modo] = 1;
    if (cuadros % 15 === 0) {
      var s = R.raiz.querySelector('svg'); nodos = Math.max(nodos, s.querySelectorAll('*').length);
      if (/NaN|Infinity|undefined/.test(new XMLSerializer().serializeToString(s))) raros++;
    }
  }
  return { fin: R.fin, cuadros: cuadros, leido: leido, raros: raros, nodos: nodos, modos: Object.keys(modos), ancho: document.documentElement.scrollWidth, vista: document.documentElement.clientWidth,
           titulo: R.nombre.textContent, voz: R.bVoz.hidden ? 'sin' : 'con' };
};
</script>
